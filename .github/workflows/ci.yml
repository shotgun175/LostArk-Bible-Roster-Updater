name: CI

on:
  push:
    branches: [main] # PR branches are covered by pull_request; bare push doubled every run
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The test suite only imports the playwright/google packages (for types and
      # pure helpers); it never launches a browser or touches the network, so no
      # `playwright install` and no Google credentials are required.
      - name: Run tests
        run: pytest -q
